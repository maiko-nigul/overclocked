<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/>
    </marker>
  </defs>
  <rect width="1000" height="640" fill="#ffffff"/>
  <text x="500" y="38" text-anchor="middle" font-size="26" font-weight="bold" fill="#222">Overclocked: core loop</text>

  <!-- core loop boxes -->
  <g font-size="17" fill="#222" text-anchor="middle">
    <rect x="390" y="70" width="220" height="80" rx="12" fill="#dbe8ff" stroke="#333" stroke-width="2"/>
    <text x="500" y="103" font-weight="bold">1. Run jobs</text>
    <text x="500" y="128">click the case + idle income</text>

    <rect x="680" y="200" width="230" height="80" rx="12" fill="#d9f2d9" stroke="#333" stroke-width="2"/>
    <text x="795" y="233" font-weight="bold">2. Earn money</text>
    <text x="795" y="258">$ per click and per second</text>

    <rect x="610" y="380" width="250" height="80" rx="12" fill="#fff1c7" stroke="#333" stroke-width="2"/>
    <text x="735" y="413" font-weight="bold">3. Buy &amp; install parts</text>
    <text x="735" y="438">6 slots x 3 tiers</text>

    <rect x="140" y="380" width="250" height="80" rx="12" fill="#ffd9d4" stroke="#333" stroke-width="2"/>
    <text x="265" y="413" font-weight="bold">4. Balance power &amp; heat</text>
    <text x="265" y="438">bigger PSU, better cooling</text>

    <rect x="90" y="200" width="230" height="80" rx="12" fill="#eadcff" stroke="#333" stroke-width="2"/>
    <text x="205" y="233" font-weight="bold">5. Unlock jobs</text>
    <text x="205" y="258">higher pay, more heat</text>
  </g>

  <!-- loop arrows -->
  <g stroke="#333" stroke-width="2.5" fill="none" marker-end="url(#arr)">
    <path d="M610,115 C680,120 760,150 790,196"/>
    <path d="M795,282 C800,320 780,350 760,376"/>
    <path d="M608,420 L394,420"/>
    <path d="M230,378 C215,340 205,310 205,284"/>
    <path d="M210,198 C240,140 320,112 386,110"/>
  </g>
  <text x="500" y="300" text-anchor="middle" font-size="20" font-style="italic" fill="#555">stronger rig = more money per click</text>
  <text x="500" y="326" text-anchor="middle" font-size="20" font-style="italic" fill="#555">= faster upgrades</text>

  <!-- risks -->
  <g font-size="15" fill="#b3261e" text-anchor="middle">
    <rect x="390" y="485" width="220" height="64" rx="10" fill="#fff" stroke="#b3261e" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="500" y="510" font-weight="bold">Risks</text>
    <text x="500" y="532">throttling x0.5 · crash 6 s</text>
  </g>
  <path d="M390,500 C340,490 300,475 280,464" stroke="#b3261e" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#arrRed)"/>

  <!-- side mechanics -->
  <g font-size="15" fill="#222" text-anchor="middle">
    <rect x="410" y="170" width="180" height="60" rx="10" fill="#f4f4f4" stroke="#777" stroke-width="1.5"/>
    <text x="500" y="195" font-weight="bold">Overclock</text>
    <text x="500" y="215">x2 for 10 s, +15 °C</text>

    <rect x="760" y="70" width="210" height="80" rx="10" fill="#f4f4f4" stroke="#777" stroke-width="1.5"/>
    <text x="865" y="95" font-weight="bold">Random events</text>
    <text x="865" y="116">rush order · dust</text>
    <text x="865" y="136">power surge</text>
  </g>
  <path d="M760,110 L614,110" stroke="#777" stroke-width="1.5" fill="none" stroke-dasharray="4 4" marker-end="url(#arr)"/>
  <path d="M500,170 L500,154" stroke="#777" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

  <!-- meta loop -->
  <g font-size="17" fill="#222" text-anchor="middle">
    <rect x="640" y="560" width="300" height="64" rx="12" fill="#ffe7a3" stroke="#333" stroke-width="2"/>
    <text x="790" y="586" font-weight="bold">Rig maxed: NEW BUILD</text>
    <text x="790" y="608">reset rig, keep 1 permanent bonus</text>
  </g>
  <path d="M760,462 L780,556" stroke="#333" stroke-width="2.5" fill="none" stroke-dasharray="8 5" marker-end="url(#arr)"/>
  <path d="M638,600 C300,620 30,560 40,300 C45,180 200,110 386,98" stroke="#333" stroke-width="2.5" fill="none" stroke-dasharray="8 5" marker-end="url(#arr)"/>
  <text x="95" y="590" font-size="15" fill="#555">next generation (meta loop)</text>
</svg>
